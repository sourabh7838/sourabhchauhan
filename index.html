<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern UI Landing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090d16;
      overflow: hidden;
      position: relative;
      color: #ffffff;
    }

    /* Ambient Animated Mesh Background */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.5;
      animation: float 10s ease-in-out infinite alternate;
    }

    .glow-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
      top: -100px;
      left: -100px;
    }

    .glow-2 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #a855f7 0%, rgba(168, 85, 247, 0) 70%);
      bottom: -150px;
      right: -150px;
      animation-delay: 5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, -30px) scale(1.15); }
    }

    /* Modern Dot Grid Overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    /* Glassmorphism Card Container */
    .card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 440px;
      padding: 2.5rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .card h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.875rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Background Elements -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="grid-overlay"></div>

  <!-- Hero Glass Card -->
  <div class="card">
    <h1>Modern Canvas</h1>
    <p>Complete single-file implementation featuring an animated mesh gradient background, dot matrix overlay, and responsive glassmorphism container.</p>
    <button class="btn">Get Started</button>
  </div>

</body>
</html>
